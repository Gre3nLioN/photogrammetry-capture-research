[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "photogrammetry-capture-research"
version = "0.1.0"
description = "Reproducible protocols and reports for low-budget photogrammetry capture experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "reconcheck>=0.1.0"]

[project.scripts]
pcr = "photogrammetry_capture_research.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/photogrammetry_capture_research"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
